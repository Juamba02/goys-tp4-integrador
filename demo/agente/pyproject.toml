[project]
name = "minisoc-agente"
version = "0.1.0"
description = "MiniSOC-IA: agente de triage con LLM local, aprobación humana y ledger auditable"
requires-python = ">=3.11"
# Sin dependencias en tiempo de ejecución: solo biblioteca estándar, para que la
# demo funcione offline y el contenedor sea chico.
dependencies = []

[project.scripts]
minisoc-agente = "minisoc_agente.cli:main"
minisoc-agente-servidor = "minisoc_agente.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minisoc_agente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
